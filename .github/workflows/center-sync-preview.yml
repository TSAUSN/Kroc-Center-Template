name: Center sync preview

# On every push to a PR into stage/production: run the center sync read-only
# and post (or update) one comment saying what the merge would change on each
# center — models for stage, code for both — and what needs a person.

on:
  pull_request:
    branches: [stage, production]
    types: [opened, synchronize, reopened]

jobs:
  preview:
    # Secrets aren't available to PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dry run
        env:
          CENTER_SECRETS: ${{ toJSON(secrets) }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/center-sync/cli.mjs deploy --branch "$BRANCH" --since "$BASE_SHA" --report center-sync-report.md

      - name: Post / update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('center-sync-report.md', 'utf8');
            } catch {
              body = 'Center sync: no report was produced — see the workflow log.\n<!-- center-sync-report -->';
            }
            const marker = '<!-- center-sync-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
