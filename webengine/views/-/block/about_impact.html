<section class="mx-4 mt-12" id="kroc-about-impact-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  // body is WYSIWYG — toJson() escapes its quotes/newlines (AGENTS.md §6)
  const item = {{this.toJson()}};

  const data = {
    sectionTitle: item.section_title,
    statValue: item.stat_value,
    statCaption: item.stat_caption,
    heading: item.heading,
    bodyHtml: { __html: item.body || "" },
    ctaLabel: item.cta_label,
    // same fallback as donation_block: one Classy URL lives in globals, so a
    // block only carries a link when it needs a different target
    ctaUrl: "{{!this.cta_link}}".trim() || "{{!globals.donation_link}}".trim(),
    image: "{{!this.stat_image.getImage(1200)}}".trim(),
    imageAlt: "{{!this.stat_image.getImageTitle()}}".trim()
  };

  ReactDOM.createRoot(document.getElementById("kroc-about-impact-{{this.zuid}}")).render(
    <AboutImpact data={data} />
  );
})();
</script>
