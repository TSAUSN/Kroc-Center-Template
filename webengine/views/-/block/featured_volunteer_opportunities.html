<section class="mx-4 mt-9" id="kroc-featured-volunteers-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  const data = {
    name: "{{!this.block_name}}",
    title: "{{!this.block_title}}",
    viewAllUrl: "{{!this.view_all_link}}",
    displayMode: "{{!this.display_mode}}",
    zuids: "{{!this.featured_opportunities}}",
    opportunities: [
      {{each volunteer_opportunities as v where FIND_IN_SET(v.zuid, '{this.featured_opportunities}')}}
      {
        item: {{v.toJson()}},
        hero: "{{!v.hero_image.getImage(800)}}",
        url: "{{v.getUrl()}}"
      },
      {{end-each}}
      null
    ].filter(Boolean)
  };

  ReactDOM.createRoot(document.getElementById("kroc-featured-volunteers-{{this.zuid}}")).render(
    <FeaturedVolunteerOpps data={data} />
  );
})();
</script>
