<section class="mx-4 mt-7 lg:mt-6" id="kroc-careers-apply-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  // body is WYSIWYG — toJson() escapes its quotes and newlines, which a
  // hand-built string literal would break on (AGENTS.md §3)
  const item = {{this.toJson()}};

  const data = {
    heading: item.heading,
    body: item.body,
    smsEyebrow: item.text_apply_eyebrow,
    smsKeyword: item.text_apply_keyword,
    smsShortcode: item.text_apply_shortcode
  };

  ReactDOM.createRoot(document.getElementById("kroc-careers-apply-{{this.zuid}}")).render(
    <CareersApply data={data} />
  );
})();
</script>
