<section class="mx-4 mt-7 lg:mt-8" id="kroc-card-grid-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  // toJson() escapes quotes in the heading, which a hand-built string literal
  // would break on (AGENTS.md §3)
  const item = {{this.toJson()}};

  const data = {
    heading: item.heading,
    // repeater rows ship raw; the [] wrapper + .flat() keeps an empty field parsing
    cards: [{{ this.cards }}]
  };

  ReactDOM.createRoot(document.getElementById("kroc-card-grid-{{this.zuid}}")).render(
    <CardGrid data={data} />
  );
})();
</script>
