<section class="mx-4 mt-9" id="kroc-daypass-intro-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  // body is WYSIWYG — toJson() escapes its quotes/newlines (AGENTS.md §6)
  const item = {{this.toJson()}};

  const data = {
    title: item.title,
    bodyHtml: { __html: item.body || "" },
    primaryCtaLabel: item.primary_cta_label,
    primaryCtaUrl: item.primary_cta_url,
    secondaryCtaLabel: item.secondary_cta_label,
    secondaryCtaUrl: item.secondary_cta_url
  };

  ReactDOM.createRoot(document.getElementById("kroc-daypass-intro-{{this.zuid}}")).render(
    <DayPassIntroBand data={data} />
  );
})();
</script>
