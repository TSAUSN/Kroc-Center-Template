<section class="mx-4 mt-7 lg:mt-5" id="kroc-notice-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  // body is WYSIWYG — toJson() escapes its quotes and newlines, which a
  // hand-built string literal would break on (AGENTS.md §3)
  const item = {{this.toJson()}};

  const data = {
    body: item.body
  };

  ReactDOM.createRoot(document.getElementById("kroc-notice-{{this.zuid}}")).render(
    <Notice data={data} />
  );
})();
</script>
