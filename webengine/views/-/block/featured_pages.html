<section class="mx-4 mt-9" id="kroc-featured-pages-{{this.zuid}}"></section>

<script type="text/babel" data-presets="react">
(() => {
  const data = {
    title: "{{!this.block_name}}",
    displayMode: "{{!this.display_mode}}",
    // repeater rows ship raw; the [] wrapper + .flat() keeps an empty field parsing
    pages: [{{ this.featured_pages }}]
  };

  ReactDOM.createRoot(document.getElementById("kroc-featured-pages-{{this.zuid}}")).render(
    <FeaturedPages data={data} />
  );
})();
</script>
